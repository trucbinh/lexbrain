name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @lexbrain/mobile build

      - name: Generate iOS project
        working-directory: apps/mobile
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Build for iOS Simulator
        working-directory: apps/mobile
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode_container=(-workspace ios/App/App.xcworkspace)
          elif [ -d ios/App/App.xcodeproj ]; then
            xcode_container=(-project ios/App/App.xcodeproj)
          else
            find ios -maxdepth 4 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print
            echo "No App.xcworkspace or App.xcodeproj found under ios/"
            exit 1
          fi

          xcodebuild \
            "${xcode_container[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        with:
          name: lexbrain-ios-simulator
          path: apps/mobile/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error